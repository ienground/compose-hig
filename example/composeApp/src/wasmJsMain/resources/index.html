<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compose HIG 미리보기</title>
  <style>html,body,#preview{width:100%;height:100%;margin:0;overflow:hidden}#loading{position:absolute;inset:0;display:grid;place-content:center;font:14px system-ui;color:#767680;background:#f2f2f7;padding:24px;text-align:center}a{color:inherit}</style>
  <script src="composeApp.js" defer></script>
</head>
<body>
  <div id="preview"></div>
  <div id="loading" role="status">Compose 미리보기를 불러오는 중입니다.<noscript>JavaScript를 켜야 미리보기를 사용할 수 있습니다.</noscript></div>
  <script>
    function showError(){let node=document.getElementById('loading');if(!node){node=document.createElement('div');node.id='loading';document.body.append(node);}node.textContent='미리보기 실행 중 오류가 발생했습니다. 초기화하거나 최신 브라우저에서 다시 시도하세요.';node.setAttribute('role','alert');}
    window.addEventListener('error',showError);
    window.addEventListener('unhandledrejection',showError);
  </script>
</body>
</html>
