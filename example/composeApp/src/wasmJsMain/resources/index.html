<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compose HIG preview</title>
  <style>html,body,#preview{width:100%;height:100%;margin:0;overflow:hidden}#loading{position:absolute;inset:0;display:grid;place-content:center;font:14px system-ui;color:#767680;background:#f2f2f7;padding:24px;text-align:center}a{color:inherit}</style>
  <script src="composeApp.js" defer></script>
</head>
<body>
  <div id="preview"></div>
  <div id="loading" role="status">Loading Compose preview.<noscript>Enable JavaScript to use this preview.</noscript></div>
  <script>
    function syncLanguage(){const ko=new URLSearchParams(location.hash.slice(1)).get('language')==='ko';document.documentElement.lang=ko?'ko':'en';const node=document.getElementById('loading');if(node)node.firstChild.textContent=ko?'Compose 미리보기를 불러오는 중입니다.':'Loading Compose preview.';}
    syncLanguage();window.addEventListener('hashchange',syncLanguage);
    function showError(){let node=document.getElementById('loading');if(!node){node=document.createElement('div');node.id='loading';document.body.append(node);}node.textContent=document.documentElement.lang==='ko'?'미리보기 실행 중 오류가 발생했습니다. 초기화하거나 최신 브라우저에서 다시 시도하세요.':'The preview encountered an error. Reset it or try a recent browser.';node.setAttribute('role','alert');}
    window.addEventListener('error',showError);
    window.addEventListener('unhandledrejection',showError);
  </script>
</body>
</html>
