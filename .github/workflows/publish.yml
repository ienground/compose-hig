name: Publish
on:
  release:
    types: [released, prereleased]
jobs:
  publish:
    name: Release build and publish
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.0.app/Contents/Developer
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: iOS SDK 버전 확인
        shell: bash
        run: |
          xcodebuild -version
          for sdk in iphoneos iphonesimulator; do
            sdk_version=$(xcrun --sdk "$sdk" --show-sdk-version)
            echo "$sdk SDK: $sdk_version"
            IFS=. read -r major minor patch <<< "$sdk_version"
            if (( major < 27 || (major == 27 && minor < 1) )); then
              echo "::error::$sdk SDK 27.1 이상이 필요합니다. 현재 버전: $sdk_version"
              exit 1
            fi
          done
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Publish to MavenCentral
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSWORD }}

